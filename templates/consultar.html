<!DOCTYPE html>
<html lang="pt-br">

<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap:">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FF8040">
  <meta name="robots" content="noindex,nofollow">

  <!-- Título -->
  <title>Agora você faz parte da Família UniFil</title>

  <!-- Favicon -->
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- CSS -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0">
</head>

<body class="bg-light">

  <div class="container">
    <div class="card">
      <h2 class="mb-2 text-center"><span>Tour Gastronômico <strong>UniFil!</strong></span></h2>
      <h5 class="mb-4 text-center">Consulte sua inscrição!</h4>
        <br>
      <h5 class="mb-2 text-center">Digite seu comprovante:</h5> 
      <!--
      <h5 class="mb-2 text-center">Agora que você faz parte da UniFil, como você será chamado?</h5>
      <h6 class="mb-4 text-center">Selecione abaixo:</h6>
      -->
      <form id="consultForm">  

        <!-- Comprovante -->
        <div class="mb-3">
          <label for="nomeCompleto" class="form-label">Comprovante:</label>
          <input type="text" class="form-control" id="comprovante" placeholder="CONF######" maxlength="10">
          <div class="invalid-feedback">Digite o comprovante</div>
        </div>

        <h3 class="mb-2 text-center"> ou </h3>
        <h5 class="mb-2 text-center">Digite seus dados</h5>

        <!-- Email -->
        <div class="mb-3" id="matriculaField">
          <label for="email" class="form-label">Insira a seu email:</label>
          <input type="email" class="form-control" id="email" placeholder="josesilva@email.com" maxlength="100">
          <div class="invalid-feedback">Email Invalido</div>
        </div>

        <!-- Telefone/Celular -->
        <div class="mb-4" id="telefoneField">
          <label for="telefone" class="form-label">Insira o seu Celular/WhatsApp:</label>
          <input type="tel" class="form-control" id="telefone" placeholder="(DDD) 00000-0000" maxlength="15">
          <div class="invalid-feedback">Insira um telefone válido (DDD) 00000-0000</div>
        </div>

        <!-- Botão de Envio -->
        <div class="d-flex justify-content-center">
          <button type="submit" class="btn btn-primary w-100" id="submitButton" disabled>Consultar</button>
        </div>
      </form>
      <br>
    </div>

    <div class="row">
      <div class="col-12 mt-4 text-center">
        <img class="logo" src="{{ url_for('static', filename='img/logo-unifil.svg') }}">
      </div>
    </div>
  </div>
  

  <!-- Script -->
  <script src="{{ url_for('static', filename='js/consultar.js') }}"></script>
</body>

</html>
