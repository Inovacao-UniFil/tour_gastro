<!DOCTYPE html>
<html lang="pt-br">

<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap:">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FF8040">
  <meta name="robots" content="noindex,nofollow">

  <!-- Título -->
  <title>Não encontrado</title>

  <!-- Favicon -->
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- CSS -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0">
</head>

<body class="bg-light"  style="background-image:url('{{ url_for('static', filename='img/background.jpg') }}');background-repeat:no-repeat;background-size:cover;background-position:center">

  <div class="container">
    <div class="card text-center">
      
      <h2 class="mb-2 text-center"><span>Tour Gastronômico <strong>UniFil!</strong></span></h2>
      <h2 id="confirmado">Não encontrado!</h2>
      <p>Não conseguimos localizar sua inscrição.</p>
      <p>Verifique se seus dados foram digitados corretamente.</p>
      <a href="/" class="btn btn-primary w-100 mt-3">Clique aqui para se inscrever.</a>
      <a href="javascript:history.back()" class="btn btn-primary w-100 mt-3">Voltar</a>

    </div>

    <div class="row">
      <div class="col-12 mt-4 text-center">
        <img class="logo" src="{{ url_for('static', filename='img/logo-unifil.svg') }}">
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    // Obtém o código de comprovante da URL e exibe na página
    const params = new URLSearchParams(window.location.search);
    const comprovante = params.get("comprovante") || "Não encontrado";
    const date = params.get("date") || "Não encontrado";
    const time = params.get("time") || "Não encontrado";
    const is_new = params.get("new") || "old";
    document.getElementById("comprovante").textContent = comprovante;
    document.getElementById("horario").textContent = date + " às " + time;
    if(is_new=="old"){
      document.getElementById("confirmado").textContent = "👍 Você já se Inscreveu! 👍";
    }else{
      document.getElementById("confirmado").textContent = "🎉 Inscrito com Sucesso! 🎉";
    }
    
  </script>

</body>

</html>
